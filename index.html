<script>
const SNAPSHOT={"snapshotVersion":"1.3.0","snapshotDate":"2026-10-12","contentStatus":"Editorial transcription for integrated internal QA; no external test/production approval","canonicalSource":"Notion Conference Leverage nine-guide editorial index v1.3, four-template bank and official-source finder","sourceMode":"reviewed structured extraction/transcription of canonical Notion page content; not byte-identical raw Notion Markdown","registrySource":"https://app.notion.com/p/3f7b144c6b99816285a3e00b9d81a596","stages":{"before":"Before the conference","during":"During the conference","after":"After the conference"},"guides":[{"id":"worth","stage":"before","title":"Is this conference worth it?","topic":"Decision","purpose":"Know whether to go, go only if funded, wait, or skip—and why.","checks":[{"label":"Name your main goal.","text":"Recruiting, learning, people or sharing a project may each make a different event worthwhile."},{"label":"Find the actual opportunity.","text":"Identify a relevant role, session or community using current organizer sources; do not count a hopeful introduction as confirmed access."},{"label":"Compare total cost and timing.","text":"Registration is only one cost. Use the funding worksheet for detailed cash/reimbursement calculations."},{"label":"Compare one alternative.","text":"A local gathering, online program or later conference may meet the same goal with less expense or pressure."}],"detailsHeading":"How to make the decision without guessing","details":["Write one useful outcome: understand a technical topic, explore eligible roles, meet builders, or share a project. Include a non-job outcome if recruiting is your main aim.","Look for evidence on the current edition’s official website: find two relevant roles, sessions or communities. Check pass and registration rules; unknown access remains Needs checking.","Estimate full costs: ticket, travel, accommodation, local transport, food, care/accessibility expenses and buffer. Separate confirmed from pending funding and upfront cash from later reimbursement.","Compare a realistic next-best choice: local event, online session, campus fair, another conference or postponing.","Record a conditional decision: Go / Go only if funded / Wait and prepare / Skip this edition. School year is not a pass/fail score.","Choose a next action; if already registered, evaluate remaining spend rather than revisiting sunk costs."],"exampleTitle":"Jordan’s fictional attendance decision","example":"Jordan wants to explore 2027 SWE opportunities and data reliability. The trip totals USD 1,200; up to USD 400 may be reimbursed later and USD 300 is pending. With a fictional USD 1,300 safe upfront limit, Jordan can proceed conditionally. With only USD 900 available, the better choice is funding or a local alternative. No universal readiness score is implied.","optionalHeading":"Optional · Worth-it snapshot","optionalBody":"Event / main outcome / source / estimated total / cash limit / funding certainty / Go, funded-only, wait or skip / next action.","related":["funding","prepare"],"tool":"decision","toolMode":"worth","exampleId":"jordan-go-decision","notionSource":"https://app.notion.com/p/3f7b144c6b998117a837ef093afa8acf","tags":["all"],"officialRefs":[]},{"id":"funding","stage":"before","title":"How can I fund my trip?","topic":"Funding","purpose":"Know what support to request, what remains uncertain, and whether you can cover costs when they are due.","checks":[{"label":"Price the entire trip.","text":"Include registration, travel, taxes/fees, meals, local transport, care/access needs and a buffer."},{"label":"Find realistic funding routes.","text":"Check the organizer, university, student organization, employer or relevant community—not just scholarship roundups."},{"label":"Read the funding terms.","text":"Eligibility, what is covered, deadlines, reimbursement timing, receipts, obligations, cancellation and stacking rules."},{"label":"Separate final cost from cash due now.","text":"Do not count pending grants as available or future reimbursements as cash in hand."}],"detailsHeading":"Where to look and how to ask","details":["Build a cost table: amount, currency, upfront payer, due date, refund rules, confirmed coverage, reimbursement date. Compute final net and maximum upfront cash separately.","Search the current organizer’s scholarship, travel grant, volunteer, speaker or ambassador pages; check the current edition, deadline and restrictions.","Search campus/employer routes for “conference travel grant,” “professional development funding,” “department travel reimbursement,” and “student government funding.” Ask relevant departments, advisers, student affairs, club finance chairs or employer contacts about the real process.","For each lead, check eligibility, covered expenses, who books, whether cash arrives in advance, receipts, reporting duties, combinations and cancellation terms. Save a public source, deadline time zone, status and next action.","Request a specific amount: event/dates, concrete learning or career goals, total budget, confirmed support, outstanding request, decision deadline, realistic share-back and required documents.","If you cannot safely front nonrefundable spending without a pending award, wait, reduce costs or use another option. Speaking or volunteering does not automatically cover attendance."],"exampleTitle":"Fictional funding and cash timing","example":"Jordan’s example trip is USD 1,200. Up to USD 400 is confirmed for post-trip reimbursement if conditions are met; USD 300 remains pending. The expected final cost is USD 800 after confirmed reimbursement, but Jordan might still need USD 1,200 upfront. The pending award is not subtracted.","optionalHeading":"Optional · Funding worksheet","optionalBody":"Source / official link / covered expense / edition and deadline / pending or confirmed / payment method / reimbursement date / next action.","related":["worth","prepare"],"tool":"budget","toolMode":null,"exampleId":"jordan-funding-ledger","notionSource":"https://app.notion.com/p/3f7b144c6b9981f7a85de426b3f4578f","tags":["cost","all"],"officialRefs":["official-registrations"]},{"id":"prepare","stage":"before","title":"What should I prepare?","topic":"Preparation","purpose":"Know what is confirmed, what still needs action, and where to find the answer.","checks":[{"label":"Conference.","text":"Save ticket/registration confirmation, pass type, dates and current attendee instructions."},{"label":"Opportunities.","text":"Profiles, job applications, scheduled meetings and event invitations may be different steps."},{"label":"Participation.","text":"Check sessions, communities or expo access relevant to your goal—not recruiting by default."},{"label":"Ready to talk.","text":"Prepare one true work/project story, a useful question, travel basics and a way to receive updates."}],"detailsHeading":"How to check each step","details":["Open the current-year organizer site and your registration email. Find the portal, ticket access, check-in, instructions and real deadlines; avoid previous-year pages.","Recruiting, if relevant: follow the organizer’s official career route, review profile/résumé as appropriate, then inspect a specific employer’s own job posting for eligibility, location, application steps and role/requisition ID.","Apply through the required employer route if appropriate, and save the real submission receipt. A talent profile, badge scan, interest form or conversation is not necessarily an application or invitation.","For learning/community/project goals, use the organizer’s session catalog/app and actual RSVP route; check time, venue, pass rules and accepted confirmation. Skip unrelated recruiting tasks.","Prepare a true 30-second story: problem → action/decision → result/learning → one question. Save confirmed appointments, timezone, travel details and one backup."],"exampleTitle":"A completed fictional access record","example":"Jordan’s example: conference registration Confirmed; Talent Network Profile complete; employer application Submitted in a simulated case; private gathering Requested—not confirmed. Each has its own recorded source and status. No actual 2026 application or invitation is claimed.","optionalHeading":"Optional · Access checklist","optionalBody":"Item / public official source or private confirmation / self-reported status / next action. Use To do, Submitted, Confirmed by me, Waitlisted, Not needed or Needs checking.","related":["prioritize"],"tool":"access","toolMode":null,"exampleId":"jordan-access-status","notionSource":"https://app.notion.com/p/3f7b144c6b998181bc61ef43ab6e7933","tags":["recruiting","learning","community","builder"],"officialRefs":["ghc-attendee","ghc-talent","shpe-careers","afrotech-official"]},{"id":"prioritize","stage":"before","title":"What should I prioritize?","topic":"Priorities","purpose":"Choose one worthwhile opportunity and one realistic alternative.","checks":[{"label":"Choose a goal.","text":"Recruiting, learning, community or building lead to different priorities."},{"label":"Find two real options.","text":"Use current organizer company/session information, then the actual employer posting, session abstract or host event page."},{"label":"Compare fit and access.","text":"Is this relevant, available to you and worth the time it would take?"},{"label":"Choose an action.","text":"Save the best target, exact source, one question or next step, and a backup."}],"detailsHeading":"How to research and rank a target","details":["Start with the current organizer’s sponsor, session, speaker or community listing. Shortlist two or three, not an exhaustive company list.","Recruiting: inspect a real current employer posting and capture title/ID, graduation and experience requirements, location and application route. Learning/community: use the actual abstract or RSVP and note time and access.","Record the public source URL, checked date, requirements, what remains unknown and why it fits. If no role/event is verified, write None confirmed yet—never invent one.","Rank qualitatively: A is close to your goal with an executable next step; B is a useful alternative; C is optional. Sponsor prestige does not imply hiring or access.","Choose a specific question/action, expected queue/travel cost, appointment confirmation if any and fallback. A booth visit does not replace a required official application."],"exampleTitle":"Fictional recruiting and builder choices","example":"Jordan compares an invented Cedar Labs SWE internship, simulated ID CL-DEMO-27, with a possible data workshop; expo access stays unknown. Sam, a fictional AFROTECH builder, seeks a relevant founder/community conversation about coordination failure, without needing a résumé-upload task.","optionalHeading":"Optional · Compare priorities","optionalBody":"Target / public source URL or Not verified / fit / access / one question / first action / backup.","related":["prepare","time"],"tool":"decision","toolMode":"prioritize","exampleId":"jordan-fictional-role","notionSource":"https://app.notion.com/p/3f7b144c6b998184a8f5cede250b5bf0","tags":["recruiting","learning","community","builder"],"officialRefs":["ghc-features","afrotech-official"]},{"id":"time","stage":"during","title":"Where should I spend my time?","topic":"Schedule","purpose":"Make a realistic day plan you can revise when sessions, queues or energy change.","checks":[{"label":"Protect confirmed commitments.","text":"Save actual start/end time, local time zone, location, access status and source."},{"label":"Choose a few flexible priorities.","text":"Each needs a reason: role, speaker, learning question or community."},{"label":"Leave space for travel and rest.","text":"Account for movement between rooms, queues, meals and breaks."},{"label":"Choose a backup.","text":"If a booth is busy or an activity is full, choose a useful alternative."}],"detailsHeading":"How to build and adjust a day plan","details":["Check the current organizer agenda and map; record the local timezone, current room/venue details and pass restrictions. Old agendas and unapproved RSVPs are not fixed commitments.","Block immovable items: confirmed meetings, sessions with actual access, speaking/volunteer duties and transport. Save local date/time, place, source or safe redacted reference and travel buffer.","Add up to three flexible priorities with goal, source, current access status and next action. Nonrecruiting plans do not need job tasks.","Compare observed queue length and remaining travel time against your next fixed appointment, energy and alternative. No universal queue cutoff or predicted availability.","Choose Keep / Swap / Skip / Verify access first, state what changes and choose a backup. Requested invitations never become fixed commitments by being on a draft calendar.","Afterward, note one useful insight or promise and a suitable follow-up action if any."],"exampleTitle":"Fictional queue versus confirmed appointment","example":"On fictional Oct 29, Jordan has an 11:15 AM workshop in “Demo Room C” with simulated access. At 10:30 AM an estimated 55-minute queue conflicts with Jordan’s departure buffer. Jordan swaps to question preparation rather than treating an optional booth as more important. These are not actual GHC sessions or rooms.","optionalHeading":"Optional · Daily field sheet","optionalBody":"Local date and timezone / fixed start-end, room and source / flexible targets, access and reason / travel buffer / backup / next action.","related":["prioritize","conversations"],"tool":"decision","toolMode":"time","exampleId":"jordan-day-schedule","notionSource":"https://app.notion.com/p/3f7b144c6b99816d9d79d3a3a7570924","tags":["all"],"officialRefs":["ghc-sessions"]},{"id":"conversations","stage":"during","title":"How do I start better conversations?","topic":"People","purpose":"Have one grounded exchange you can remember and, when appropriate, continue.","checks":[{"label":"Open with context.","text":"Who you are, what caught your attention or what you are working on—briefly, not a rehearsed autobiography."},{"label":"Ask and listen.","text":"Match the question to a recruiter, engineer, speaker, founder or peer; follow up on the answer."},{"label":"Close naturally.","text":"Thank them, note the useful part and propose a next step only if appropriate."}],"detailsHeading":"Conversation openings for different people","details":["Recruiter: “I’m a May 2027 student exploring SWE roles. I found [actual role/requisition]. Is there a conference-specific application step or should I follow the posting?” A badge scan is not an interview.","Engineer/speaker: “Your explanation of [actual public detail] connects to [real work]. What made the team choose [specific trade-off]?”","Peer/organizer: “I’m exploring [shared interest]. What drew you to this community? Are there public resources you recommend?”","Builder/founder: “I’m testing a way to coordinate group activities. When plans fall apart, which step is hardest?” Listen before a product pitch.","Close with thanks and something you will genuinely investigate. A useful conversation need not yield a referral or private contact."],"exampleTitle":"Fictional exchange","example":"Jordan mentions a class project with inconsistent data and asks what testing trade-off mattered. Maya responds about handling conflicting records; Jordan plans to test that idea. In the fictional example, Maya offers LinkedIn and Jordan promises a project link. No real contact is implied.","optionalHeading":"Copyable prompt · No form","optionalBody":"I noticed [specific public detail] → I have experience with [true context] → I am curious about [answerable question]. Afterward note one insight and any real promise.","related":["explore","followup"],"tool":"prompt","toolMode":null,"exampleId":"jordan-maya-exchange","notionSource":"https://app.notion.com/p/3f7b144c6b998132b3b7ddc3434b4bba","tags":["recruiting","learning","community","builder"],"officialRefs":[]},{"id":"explore","stage":"during","title":"What else should I explore?","topic":"Community","purpose":"Find a worthwhile learning or community activity you can actually access.","checks":[{"label":"Choose a purpose.","text":"Learn one idea, meet shared-interest peers, get project feedback or enjoy the community."},{"label":"Find a real activity.","text":"Search the current organizer catalog/app, campus or professional groups and hosts’ event pages."},{"label":"Check entry and logistics.","text":"Public versus member-only, invitation requested versus accepted, ticket rules, time and venue."},{"label":"Keep an alternative.","text":"Have an accessible session, conversation, meal or break if plans change."}],"detailsHeading":"Where to look and what to save","details":["Open the current-year organizer catalog/app and organizer-linked side events. Session listings do not guarantee every pass has admission.","Use relevant school chapters, communities, speakers or hosts to discover events, but confirm using the actual host’s current registration route.","Record activity name, host, audience, cost, pass restrictions, local time, venue, RSVP requested/waitlisted/accepted, and source; unknown access stays Needs checking.","Choose setting based on purpose, travel and energy: workshops for practice, panels for contrasting approaches, discussions for depth, socials for peers.","Speaking, volunteering and content coverage require separate checks of responsibilities, consent and payment/access; do not assume free travel or media privileges."],"exampleTitle":"Fictional AFROTECH builder path","example":"Sam wants to understand group-activity coordination. A founder gathering is merely a research lead until the official organizer and host process confirms access. If restricted, Sam switches to an accessible peer conversation or session.","optionalHeading":"Optional · Save an activity","optionalBody":"Purpose / activity or community / public source URL / local time and venue / access status / one question or action / backup.","related":["time"],"tool":"action","toolMode":"explore","exampleId":"sam-community-path","notionSource":"https://app.notion.com/p/3f7b144c6b9981df9cd6d33e53927521","tags":["learning","community","builder","recruiting"],"officialRefs":["afrotech-official"]},{"id":"followup","stage":"after","title":"Who should I follow up with?","topic":"Connections","purpose":"Finish meaningful commitments without messaging everyone.","checks":[{"label":"Recall what happened.","text":"Where you met and the specific topic or next step discussed."},{"label":"Choose the right action.","text":"Official job application, promised resource, one small question or a learning experiment; messages are not always necessary."},{"label":"Use an appropriate route.","text":"Use the contact method offered, a suitable public professional channel or the official process; do not guess private emails."},{"label":"Track what you control.","text":"Mark an action done separately from replies, applications, interviews or offers."}],"detailsHeading":"How to follow through without guessing","details":["Record context, actual topic, promise or instruction, offered channel and agreed timing privately; do not publicly expose personal contacts.","If told to apply through the employer’s official portal, do that instead of inventing a recruiter email. If you promised a link, use a real appropriate route. Learning with no contact can still lead to action.","Draft only from real details: where you met → accurate insight/promise → relevant action/resource → short close. Do not fabricate referrals or commitments.","Honor agreed timing; thoughtful follow-up within a day or two may help but is not a universal deadline. Record the date completed.","Track action done/sent, external reply, application and interview/offer as independent statuses. No reply does not invalidate a useful conversation."],"exampleTitle":"Two fictional follow-through outcomes","example":"Jordan has a simulated
