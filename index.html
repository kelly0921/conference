const SNAPSHOT={"snapshotVersion":"1.3.0","snapshotDate":"2026-10-12","contentStatus":"Editorial transcription for integrated internal QA; no external test/production approval","canonicalSource":"Notion Conference Leverage nine-guide editorial index v1.3, four-template bank and official-source finder","sourceMode":"reviewed structured extraction/transcription of canonical Notion page content; not byte-identical raw Notion Markdown","registrySource":"https://app.notion.com/p/3f7b144c6b99816285a3e00b9d81a596","stages":{"before":"Before the conference","during":"During the conference","after":"After the conference"},"guides":[{"id":"worth","stage":"before","title":"Is this conference worth it?","topic":"Decision","purpose":"Know whether to go, go only if funded, wait, or skip—and why.","checks":[{"label":"Name your main goal.","text":"Recruiting, learning, people or sharing a project may each make a different event worthwhile."},{"label":"Find the actual opportunity.","text":"Identify a relevant role, session or community using current organizer sources; do not count a hopeful introduction as confirmed access."},{"label":"Compare total cost and timing.","text":"Registration is only one cost. Use the funding worksheet for detailed cash/reimbursement calculations."},{"label":"Compare one alternative.","text":"A local gathering, online program or later conference may meet the same goal with less expense or pressure."}],"detailsHeading":"How to make the decision without guessing","details":["Write one useful outcome: understand a technical topic, explore eligible roles, meet builders, or share a project. Include a non-job outcome if recruiting is your main aim.","Look for evidence on the current edition’s official website: find two relevant roles, sessions or communities. Check pass and registration rules; unknown access remains Needs checking.","Estimate full costs: ticket, travel, accommodation, local transport, food, care/accessibility expenses and buffer. Separate confirmed from pending funding and upfront cash from later reimbursement.","Compare a realistic next-best choice: local event, online session, campus fair, another conference or postponing.","Record a conditional decision: Go / Go only if funded / Wait and prepare / Skip this edition. School year is not a pass/fail score.","Choose a next action; if already registered, evaluate remaining spend rather than revisiting sunk costs."],"exampleTitle":"Jordan’s fictional attendance decision","example":"Jordan wants to explore 2027 SWE opportunities and data reliability. The trip totals USD 1,200; up to USD 400 may be reimbursed later and USD 300 is pending. With a fictional USD 1,300 safe upfront limit, Jordan can proceed conditionally. With only USD 900 available, the better choice is funding or a local alternative. No universal readiness score is implied.","optionalHeading":"Optional · Worth-it snapshot","optionalBody":"Event / main outcome / source / estimated total / cash limit / funding certainty / Go, funded-only, wait or skip / next action.","related":["funding","prepare"],"tool":"decision","toolMode":"worth","exampleId":"jordan-go-decision","notionSource":"https://app.notion.com/p/3f7b144c6b998117a837ef093afa8acf","tags":["all"],"officialRefs":[]},{"id":"funding","stage":"before","title":"How can I fund my trip?","topic":"Funding","purpose":"Know what support to request, what remains uncertain, and whether you can cover costs when they are due.","checks":[{"label":"Price the entire trip.","text":"Include registration, travel, taxes/fees, meals, local transport, care/access needs and a buffer."},{"label":"Find realistic funding routes.","text":"Check the organizer, university, student organization, employer or relevant community—not just scholarship roundups."},{"label":"Read the funding terms.","text":"Eligibility, what is covered, deadlines, reimbursement timing, receipts, obligations, cancellation and stacking rules."},{"label":"Separate final cost from cash due now.","text":"Do not count pending grants as available or future reimbursements as cash in hand."}],"detailsHeading":"Where to look and how to ask","details":["Build a cost table: amount, currency, upfront payer, due date, refund rules, confirmed coverage, reimbursement date. Compute final net and maximum upfront cash separately.","Search the current organizer’s scholarship, travel grant, volunteer, speaker or ambassador pages; check the current edition, deadline and restrictions.","Search campus/employer routes for “conference travel grant,” “professional development funding,” “department travel reimbursement,” and “student government funding.” Ask relevant departments, advisers, student affairs, club finance chairs or employer contacts about the real process.","For each lead, check eligibility, covered expenses, who books, whether cash arrives in advance, receipts, reporting duties, combinations and cancellation terms. Save a public source, deadline time zone, status and next action.","Request a specific amount: event/dates, concrete learning or career goals, total budget, confirmed support, outstanding request, decision deadline, realistic share-back and required documents.","If you cannot safely front nonrefundable spending without a pending award, wait, reduce costs or use another option. Speaking or volunteering does not automatically cover attendance."],"exampleTitle":"Fictional funding and cash timing","example":"Jordan’s example trip is USD 1,200. Up to USD 400 is confirmed for post-trip reimbursement if conditions are met; USD 300 remains pending. The expected final cost is USD 800 after confirmed reimbursement, but Jordan might still need USD 1,200 upfront. The pending award is not subtracted.","optionalHeading":"Optional · Funding worksheet","optionalBody":"Source / official link / covered expense / edition and deadline / pending or confirmed / payment method / reimbursement date / next action.","related":["worth","prepare"],"tool":"budget","toolMode":null,"exampleId":"jordan-funding-ledger","notionSource":"https://app.notion.com/p/3f7b144c6b9981f7a85de426b3f4578f","tags":["cost","all"],"officialRefs":["official-registrations"]},{"id":"prepare","stage":"before","title":"What should I prepare?","topic":"Preparation","purpose":"Know what is confirmed, what still needs action, and where to find the answer.","checks":[{"label":"Conference.","text":"Save ticket/registration confirmation, pass type, dates and current attendee instructions."},{"label":"Opportunities.","text":"Profiles, job applications, scheduled meetings and event invitations may be different steps."},{"label":"Participation.","text":"Check sessions, communities or expo access relevant to your goal—not recruiting by default."},{"label":"Ready to talk.","text":"Prepare one true work/project story, a useful question, travel basics and a way to receive updates."}],"detailsHeading":"How to check each step","details":["Open the current-year organizer site and your registration email. Find the portal, ticket access, check-in, instructions and real deadlines; avoid previous-year pages.","Recruiting, if relevant: follow the organizer’s official career route, review profile/résumé as appropriate, then inspect a specific employer’s own job posting for eligibility, location, application steps and role/requisition ID.","Apply through the required employer route if appropriate, and save the real submission receipt. A talent profile, badge scan, interest form or conversation is not necessarily an application or invitation.","For learning/community/project goals, use the organizer’s session catalog/app and actual RSVP route; check time, venue, pass rules and accepted confirmation. Skip unrelated recruiting tasks.","Prepare a true 30-second story: problem → action/decision → result/learning → one question. Save confirmed appointments, timezone, travel details and one backup."],"exampleTitle":"A completed fictional access record","example":"Jordan’s example: conference registration Confirmed; Talent Network Profile complete; employer application Submitted in a simulated case; private gathering Requested—not confirmed. Each has its own recorded source and status. No actual 2026 application or invitation is claimed.","optionalHeading":"Optional · Access checklist","optionalBody":"Item / public official source or private confirmation / self-reported status / next action. Use To do, Submitted, Confirmed by me, Waitlisted, Not needed or Needs checking.","related":["prioritize"],"tool":"access","toolMode":null,"exampleId":"jordan-access-status","notionSource":"https://app.notion.com/p/3f7b144c6b998181bc61ef43ab6e7933","tags":["recruiting","learning","community","builder"],"officialRefs":["ghc-attendee","ghc-talent","shpe-careers","afrotech-official"]},{"id":"prioritize","stage":"before","title":"What should I prioritize?","topic":"Priorities","purpose":"Choose one worthwhile opportunity and one realistic alternative.","checks":[{"label":"Choose a goal.","text":"Recruiting, learning, community or building lead to different priorities."},{"label":"Find two real options.","text":"Use current organizer company/session information, then the actual employer posting, session abstract or host event page."},{"label":"Compare fit and access.","text":"Is this relevant, available to you and worth the time it would take?"},{"label":"Choose an action.","text":"Save the best target, exact source, one question or next step, and a backup."}],"detailsHeading":"How to research and rank a target","details":["Start with the current organizer’s sponsor, session, speaker or community listing. Shortlist two or three, not an exhaustive company list.","Recruiting: inspect a real current employer posting and capture title/ID, graduation and experience requirements, location and application route. Learning/community: use the actual abstract or RSVP and note time and access.","Record the public source URL, checked date, requirements, what remains unknown and why it fits. If no role/event is verified, write None confirmed yet—never invent one.","Rank qualitatively: A is close to your goal with an executable next step; B is a useful alternative; C is optional. Sponsor prestige does not imply hiring or access.","Choose a specific question/action, expected queue/travel cost, appointment confirmation if any and fallback. A booth visit does not replace a required official application."],"exampleTitle":"Fictional recruiting and builder choices","example":"Jordan compares an invented Cedar Labs SWE internship, simulated ID CL-DEMO-27, with a possible data workshop; expo access stays unknown. Sam, a fictional AFROTECH builder, seeks a relevant founder/community conversation about coordination failure, without needing a résumé-upload task.","optionalHeading":"Optional · Compare priorities","optionalBody":"Target / public source URL or Not verified / fit / access / one question / first action / backup.","related":["prepare","time"],"tool":"decision","toolMode":"prioritize","exampleId":"jordan-fictional-role","notionSource":"https://app.notion.com/p/3f7b144c6b998184a8f5cede250b5bf0","tags":["recruiting","learning","community","builder"],"officialRefs":["ghc-features","afrotech-official"]},{"id":"time","stage":"during","title":"Where should I spend my time?","topic":"Schedule","purpose":"Make a realistic day plan you can revise when sessions, queues or energy change.","checks":[{"label":"Protect confirmed commitments.","text":"Save actual start/end time, local time zone, location, access status and source."},{"label":"Choose a few flexible priorities.","text":"Each needs a reason: role, speaker, learning question or community."},{"label":"Leave space for travel and rest.","text":"Account for movement between rooms, queues, meals and breaks."},{"label":"Choose a backup.","text":"If a booth is busy or an activity is full, choose a useful alternative."}],"detailsHeading":"How to build and adjust a day plan","details":["Check the current organizer re, what caught your attention or what you are working on—briefly, not a rehearsed autobiography."},{"label":"Ask and listen.","text":"Match the question to a recruiter, engineer, speaker, founder or peer; follow up on the answer."},{"label":"Close naturally.","text":"Thank them, note the useful part and propose a next step only if appropriate."}],"detailsHeading":"Conversation openings for different people","details":["Recruiter: “I’m a May 2027 student exploring SWE roles. I found [actual role/requisition]. Is there a conference-specific application step or should I follow the posting?” A badge scan is not an interview.","Engineer/speaker: “Your explanation of [actual public detail] connects to [real work]. What made the team choose [specific trade-off]?”","Peer/organizer: “I’m exploring [shared interest]. What drew you to this community? Are there public resources you recommend?”","Builder/founder: “I’m testing a way to coordinate group activities. When plans fall apart, which step is hardest?” Listen before a product pitch.","Close with thanks and something you will genuinely investigate. A useful conversation need not yield a referral or private contact."],"exampleTitle":"Fictional exchange","example":"Jordan mentions a class project with inconsistent data and asks what testing trade-off mattered. Maya responds about handling conflicting records; Jordan plans to test that idea. In the fictional example, Maya offers LinkedIn and Jordan promises a project link. No real contact is implied.","optionalHeading":"Copyable prompt · No form","optionalBody":"I noticed [specific public detail] → I have experience with [true context] → I am curious about [answerable question]. Afterward note one insight and any real promise.","related":["explore","followup"],"tool":"prompt","toolMode":null,"exampleId":"jordan-maya-exchange","notionSource":"https://app.notion.com/p/3f7b144c6b998132b3b7ddc3434b4bba","tags":["recruiting","learning","community","builder"],"officialRefs":[]},{"id":"explore","stage":"during","title":"What else should I explore?","topic":"Community","purpose":"Find a worthwhile learning or community activity you can actually access.","checks":[{"label":"Choose a purpose.","text":"Learn one idea, meet shared-interest peers, get project feedback or enjoy the community."},{"label":"Find a real activity.","text":"Search the current organizer catalog/app, campus or professional groups and hosts’ event pages."},{"label":"Check entry and logistics.","text":"Public versus member-only, invitation requested versus accepted, ticket rules, time and venue."},{"label":"Keep an alternative.","text":"Have an accessible session, conversation, meal or break if plans change."}],"detailsHeading":"Where to look and what to save","details":["Open the current-year organizer catalog/app and organizer-linked side events. Session listings do not guarantee every pass has admission.","Use relevant school chapters, communities, speakers or hosts to discover events, but confirm using the actual host’s current registration route.","Record activity name, host, audience, cost, pass restrictions, local time, venue, RSVP requested/waitlisted/accepted, and source; unknown access stays Needs checking.","Choose setting based on purpose, travel and energy: workshops for practice, panels for contrasting approaches, discussions for depth, socials for peers.","Speaking, volunteering and content coverage require separate checks of responsibilities, consent and payment/access; do not assume free travel or media privileges."],"exampleTitle":"Fictional AFROTECH builder path","example":"Sam wants to understand group-activity coordination. A founder gathering is merely a research lead until the official organizer and host process confirms access. If restricted, Sam switches to an accessible peer conversation or session.","optionalHeading":"Optional · Save an activity","optionalBody":"Purpose / activity or community / public source URL / local time and venue / access status / one question or action / backup.","related":["time"],"tool":"action","toolMode":"explore","exampleId":"sam-community-path","notionSource":"https://app.notion.com/p/3f7b144c6b9981df9cd6d33e53927521","tags":["learning","community","builder","recruiting"],"officialRefs":["afrotech-official"]},{"id":"followup","stage":"after","title":"Who should I follow up with?","topic":"Connections","purpose":"Finish meaningful commitments without messaging everyone.","checks":[{"label":"Recall what happened.","text":"Where you met and the specific topic or next step discussed."},{"label":"Choose the right action.","text":"Official job application, promised resource, one small question or a learning experiment; messages are not always necessary."},{"label":"Use an appropriate route.","text":"Use the contact method offered, a suitable public professional channel or the official process; do not guess private emails."},{"label":"Track what you control.","text":"Mark an action done separately from replies, applications, interviews or offers."}],"detailsHeading":"How to follow through without guessing","details":["Record context, actual topic, promise or instruction, offered channel and agreed timing privately; do not publicly expose personal contacts.","If told to apply through the employer’s official portal, do that instead of inventing a recruiter email. If you promised a link, use a real appropriate route. Learning with no contact can still lead to action.","Draft only from real details: where you met → accurate insight/promise → relevant action/resource → short close. Do not fabricate referrals or commitments.","Honor agreed timing; thoughtful follow-up within a day or two may help but is not a universal deadline. Record the date completed.","Track action done/sent, external reply, application and interview/offer as independent statuses. No reply does not invalidate a useful conversation."],"exampleTitle":"Two fictional follow-through outcomes","example":"Jordan has a simulated ns without consent."],"exampleTitle":"Fictional insight to action","example":"Sam observes that people sometimes agree to group activities without setting a time. With no contact details exchanged, Sam plans a small opt-in reminder prototype and to show it to willing friends one week later. Its effectiveness is not assumed.","optionalHeading":"Optional · Insight-to-action","optionalBody":"Original goal / observed experience / insight / action or deliberate no-action / review date / actual outcome. Public posting is optional.","related":["followup"],"tool":"action","toolMode":"learning","exampleId":"sam-insight-to-prototype","notionSource":"https://app.notion.com/p/3f7b144c6b9981da9ce5c2ddc1359f18","tags":["all"],"officialRefs":[]}],"templates":{"funding":{"name":"Funding request","stage":"before","text":"Hi [Name],\n\nI am requesting support to attend [Conference] because it connects directly to my goals in [role/theme].\n\nAt the conference, I plan to focus on [sessions/sponsors/communities] so I can learn more about [specific topic].\n\nI also plan to bring the value back to [school/org/community] by [share-back plan].\n\nEstimated cost:\n- Registration: [amount]\n- Travel: [amount]\n- Lodging: [amount]\n- Total: [amount]\n\nFunding requested: [amount]\n\nThank you for considering my request,\n[Name]","check":"Check recipient, eligibility, pending versus confirmed awards, decision deadline and actual covered expenses."},"pre":{"name":"Pre-conference reach-out","stage":"before","text":"Hi [Name],\n\nI saw that you may be attending [Conference] with [Company/Org]. I am a [year/stage] interested in [role/theme], and I have been following [specific team/product/session/topic].\n\nIf you are open to it, I would love to stop by during the conference or find a quick time to introduce myself.\n\nBest,\n[Name]","check":"Verify participation and real context. Make a small, flexible request; do not imply an appointment exists."},"follow":{"name":"Same-day follow-up","stage": function todayUTC(){let d=new Date();return Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())}
function dateUTC(s){const a=String(s||'').split('-').map(Number);if(a.length!==3||a.some(n=>!n))return todayUTC();return Date.UTC(a[0],a[1]-1,a[2]);}
function daysTo(s){return Math.round((dateUTC(s)-todayUTC())/86400000)}
function prettyDate(s){if(!s)return 'Date not set';try{return new Date(s+'T12:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}catch(e){return s}}

function getPlan(){return db.activeId?db.plans[db.activeId]:null}

function createCustom(){const name=document.getElementById('custom-name')?.value.trim();const date=document.getElementById('custom-date')?.value;if(!name||!date){notify('Enter a conference name and start date.');return}const id='custom-'+Date.now();db.plans[id]=makePlan(id,name,date,'',date);db.activeId=id;save();location.hash='#/conference';render()}
function switchPlan(id){if(!db.plans[id])return;db.activeId=id;save();editingTarget=-1;location.hash='#/conference';render()}
function routeHash(){return (location.hash||'#/playbook/before').replace(/^#\/?/,'').split('/').filter(Boolean)}
function navTo(route){location.hash='#/'+route;if(routeHash().join('/')===route)render();window.scrollTo(0,0)}
function render(){const r=routeHash(),view=r[0]||'playbook',target=r[1]||'';let html;if(view==='guide'&&GUIDE_BY_ID[target])html=renderGuide(GUIDE_BY_ID[target]);else if(view==='conference')html=renderConference();else if(view==='templates')html=renderTemplates(target);else if(view==='plan')html=renderFieldPlan();else if(view==='downloads')html=renderDownloads();else html=renderHome(STAGES[target]?target:'before');document.getElementById('main').innerHTML=html;document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('active',(view==='conference'||view==='plan'?a.dataset.nav==='conference':(view==='templates'||view==='downloads'?a.dataset.nav==='templates':a.dataset.nav==='playbook'))));document.title=(view==='guide'&&GUIDE_BY_ID[target]?GUIDE_BY_ID[target].title+' · ':'')+'Conference Playbook';}
function renderHome(stage){selectedStage=stage;const g=GUIDES.filter(g=>g.stage===stage),p=getPlan(),d=p?daysTo(p.date):null;return `<section class="pageintro"><div class="eyebrow">A practical conference resource</div><h1>The Conference Playbook</h1><p class="lead" style="margin-top:12px">Short guides, worked examples and planning tools for tech conferences. Read only what you need—or make a plan you can take with you.</p></section><nav class="stagebar" aria-label="Conference stage">${Object.keys(STAGES).map(st=>`<a href="#/playbook/${st}" class="${stage===st?'active':''}" ${stage===st?'aria-current="page"':''}>${st==='before'?'Before':st==='during'?'During':'After'}</a>`).join('')}</nav><div class="resource-layout"><section><div class="topicline"><strong>${esc(STAGES[stage].title)}</strong><span>${g.length} focused guides</span></div><div class="cardlist">${g.map(z=>`<a class="resource-card" href="#/guide/${z.id}"><div class="eyebrow">${esc(z.topic)}</div><strong>${esc(z.title)}</strong><p>${esc(z.subtitle)}</p><span class="card-foot"><span>Checklist · Example · Optional tool</span><span aria-hidden="true">↗</span></span></a>`).join('')}</div></section><aside><div class="quiet-card"><div class="eyebrow">Hands-on planning</div><h3>${p?'Continue '+esc(p.name):stage==='before'?'Make a preparation plan':stage==='during'?'Use a field plan':'Review your next steps'}</h3><p>${p?(d>=0?`${d} day${d===1?'':'s'} until the conference. Return to your saved checklist, templates and priorities.`:'Your saved notes and follow-through are ready.'):'A guided checklist, practical templates and one print-ready field plan. You can read this Playbook without starting.'}</p><a class="plainlink" href="#/conference">${p?'Open my conference →':'Open preparation checklist →'}</a></div><div class="quiet-card"><div class="eyebrow">Available offline</div><h3>Printable Playbook + Workbook</h3><p>Blank worksheets and the original four template families, laid out for writing by hand.</p><a class="plainlink" href="conference-playbook-workbook-v5.pdf" download>Download printable PDF ↓</a><div class="linkrow"><a href="#/downloads">Other print options</a></div></div><p class="fineprint">Conference-specific recruiting, scholarships and invitations are not verified by this prototype. Follow current organizer instructions.</p></aside></div>`}
function guideExample(g){const x=g.ex||{};if(x.type==='budget'){return `<div class="example"><p>${esc(x.intro)}</p><div class="duocol"><div class="mini-panel"><div class="k">After confirmed support</div><div class="v">${esc(x.net)}</div><p>Excludes pending applications</p></div><div class="mini-panel ok"><div class="k">Possible upfront cash</div><div class="v">${esc(x.cash)}</div><p>Before reimbursement</p></div></div><p>${esc(x.foot)}</p></div>`}
if(x.type==='status')return `<div class="example"><p><b>Not enough:</b> ${esc(x.bad)}</p><table>${x.rows.map(a=>`<tr><td>${esc(a[0])}</td><td>${esc(a[1])}</td></tr>`).join('')}</table><p>${esc(x.foot)}</p></div>`;
if(x.type==='questions')return `<div class="example"><p><b>Too broad:</b> ${esc(x.bad)}</p><p><b>More specific:</b> ${esc(x.good)}</p><table>${x.rows.map(a=>`<tr><td>${esc(a[0])}</td><td style="text-align:left">${esc(a[1])}</td></tr>`).join('')}</table><p>${esc(x.foot)}</p></div>`;
if(x.type==='day')return `<div class="example"><p><b>Expo-only:</b> ${esc(x.bad)}</p><table>${x.rows.map(a=>`<tr><td>${esc(a[0])}</td><td>${esc(a[1])}</td></tr>`).join('')}</table><p>${esc(x.foot)}</p></div>`;
if(x.type==='learning')return `<div class="example"><p><b>Vague:</b> ${esc(x.bad)}</p><div class="duocol">${x.nodes.map(a=>`<div class="mini-panel"><div class="k">${esc(a[0])}</div><p>${esc(a[1])}</p></div>`).join('')}</div><p>${esc(x.foot)}</p></div>`;
return `<div class="example">${x.intro?`<p>${esc(x.intro)}</p>`:''}<div class="duocol"><div class="mini-panel"><div class="k">${esc(x.bad_label||'Less useful')}</div><p>${esc(x.bad)}</p></div><div class="mini-panel ok"><div class="k">${esc(x.good_label||'Better choice')}</div><p>${esc(x.good)}</p></div></div><p>${esc(x.foot||'Illustrative, not an actual conference or attendee outcome.')}</p></div>`;
}
const GUIDE_TASK={worth:'decision',funding:'budget',prepare:'access',prioritize:'targets',time:'daychoice',conversations:'story',explore:'experience',followup:'notes',learning:'learning'};
function renderGuide(g){const st=g.stage;const p=getPlan();const refKeys=[...new Set([...(g.officialRefs||[]),...(p&&SNAPSHOT.events[p.id]?SNAPSHOT.events[p.id].sourceRefs:[])])].filter(k=>SNAPSHOT.sources[k]&&(!p||!SNAPSHOT.sources[k].event||SNAPSHOT.sources[k].event===p.id));return `<div class="crumb no-print"><a href="#/playbook/${st}">← ${esc(STAGES[st].title)}</a><span>/</span><span>${esc(g.topic)}</span></div><div class="guide-layout"><article class="guide-main" id="print-guide"><div class="eyebrow">${esc(st)} · ${esc(g.topic)} · Editorial v${esc(SNAPSHOT.snapshotVersion)}</div><h1>${esc(g.title)}</h1><p class="guide-sub">${esc(g.purpose)}</p><hr class="sep"><h2>${g.checks.length} useful checks</h2><ol class="checks">${g.checks.map((c,i)=>`<li><span class="num">${String(i+1).padStart(2,'0')}</span><div><b>${esc(c.label)}</b><p>${esc(c.text)}</p></div></li>`).join('')}</ol><hr class="sep"><h2>Completed teaching example</h2><div class="example"><p><strong>${esc(g.exampleTitle)}</strong></p><p>${esc(g.example)}</p><p class="fineprint">Fictional teaching example. These are not current jobs, meetings, grants or confirmed event programs.</p></div><details class="guide-details"><summary>${esc(g.detailsHeading)} <span aria-hidden="true">↓</span></summary><ol class="method-steps">${g.details.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></details><div class="toolbox no-print"><div class="eyebrow">Optional worksheet</div><h3>${esc(g.optionalHeading)}</h3><p>${esc(g.optionalBody)}</p>${g.tool==='prompt'?`<button class="btn" data-copy-text="I noticed [specific detail]. This connects to [real experience]. I'm curious about [one answerable question].">Copy conversation prompt</button>`:`<button class="btn primary" data-launch="${esc(GUIDE_TASK[g.id]||'access')}">Use this in My Conference →</button>`}</div><div class="linkrow no-print" style="margin-top:20px"><button class="btn sm" data-print="guide">Print this guide</button><a class="plainlink" href="conference-playbook-workbook-v5.pdf">Printable workbook ↓</a></div>${refKeys.length?`<details class="source-refs no-print"><summary>Official references · checked ${esc(SNAPSHOT.sourceCheckedDate)}</summary><ul>${refKeys.map(k=>{const s=SNAPSHOT.sources[k];return `<li><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.label)} ↗</a><div class="fineprint">${esc(s.note)}</div></li>`}).join('')}</ul></details>`:''}<p class="sourcenote">General procedures and fictional examples. Check official sources for current editions, access and eligibility. <a href="${esc(g.notionSource)}" target="_blank" rel="noopener noreferrer">Editorial source ↗</a></p></article><aside class="guide-aside no-print"><div class="quiet-card"><div class="eyebrow">More in this stage</div><div class="topiclist">${GUIDES.filter(z=>z.stage===st).map(z=>`<a class="${z.id===g.id?'current':''}" href="#/guide/${z.id}">${esc(z.title)}</a>`).join('')}</div></div><div class="quiet-card"><div class="eyebrow">My Conference</div><h3>Use what you learned</h3><p>Save a real source, action or commitment to your event plan.</p><a class="plainlink" href="#/conference">Open My Conference →</a></div></aside></div>`}
function renderSetup(){return `<section class="setup"><div class="eyebrow">My Conference</div><h1>Choose the conference you're preparing for</h1><p class="lead" style="margin-top:13px">Create a private planning workspace only when you need it. The Playbook is free to read without choosing an event.</p>${localStorage.getItem(OLD_STORAGE)?`<div class="quiet-card"><p><strong>Have an earlier v4 plan?</strong> You can import it into a new separate v5 workspace. Event access still needs rechecking.</p><button class="btn" data-import-v4="1">Import my v4 plans</button></div>`:''}<div class="setuplist">${Object.entries(EVENTS).map(([id,e])=>`<button class="select-card" data-create-event="${id}"><strong>${esc(e.name)}</strong><span>${esc(prettyDate(e.date))}</span><span>${esc(e.location)}</span></button>`).join('')}</div><div class="quiet-card"><h3>Another conference</h3><p>Add a name and date; the planning format stays the same. We won't invent an official event program.</p><div class="fg2"><div class="formrow"><label for="custom-name">Conference name</label><input id="custom-name" placeholder="Conference or event name" maxlength="100"></div><div class="formrow"><label for="custom-date">Start date</label><input type="date" id="custom-date"></div></div><button class="btn primary" data-create-custom>Create custom plan</button></div></section>`}
function renderConference(){const p=getPlan();if(!p)return renderSetup();let n=daysTo(p.date);if(n<=0&&taskPhase==='now')taskPhase=n>=-7?'onsite':'after';const phaseTitle=n>30?'Long-range preparation':n>14?'Prepare this month':n>7?'Your next two weeks':n>0?'Final-week essentials':n>=-5?'During the conference':'Follow through afterward';return `<div class="event-banner"><div><div class="eyebrow">My Conference · Browser-local · v${esc(SNAPSHOT.snapshotVersion)}</div><h1>${esc(p.name)}</h1><p class="muted small">${esc(prettyDate(p.date))}${p.location?' · '+esc(p.location):''} · ${esc(phaseTitle)}</p></div><div class="chooser"><label class="tiny muted" for="switch-event">Switch event</label><select id="switch-event"><option value="${esc(p.id)}">${esc(p.name)}</option>${Object.values(db.plans).filter(v=>v.id!==p.id).map(v=>`<option value="${esc(v.id)}">${esc(v.name)}</option>`).join('')}</select><button class="btn sm" data-show-add="1">Add event</button></div></div><div class="bar" style="margin:0 0 18px"><span class="event-pill">${n>0?n+' days until start':n===0?'Conference starts today':n>=-4?'Event underway or recently started':'After event'}</span><div class="chooser"><label class="tiny muted" for="plan-goal">Main goal</label><select id="plan-goal" data-plan-goal="1"><option value="">Choose if useful</option>${['Recruiting / career','Technical learning','People / community','Build / share a project'].map(x=>`<option ${p.goal===x?'selected':''}>${x}</option>`).join('')}</select><a href="#/plan" class="plainlink">My field plan →</a></div></div><div class="conference-grid"><section class="timelinebox"><h3>What needs attention now?</h3><p class="fine">Choose the relevant preparation step. Suggested timing is general—not an organizer deadline.</p><div class="phasebuttons">${[['now','Now'],['week','Final week'],['onsite','At event'],['after','After']].map(([k,label])=>`<button class="${taskPhase===k?'active':''}" data-phase="${k}">${label}</button>`).join('')}</div><div id="timeline-tasks">${renderTaskList(p)}</div></section><section class="edbox">${renderEditor(p)}</section></div><div class="linkrow no-print" style="margin-top:20px"><button class="btn" data-review="1">Review my plan (rules-based, not AI)</button><a href="#/downloads" class="plainlink">Printable resources ↓</a></div><div class="fineprint" style="margin-top:12px">Only this browser stores your data. No account, cloud sync or live AI; clearing browser data can remove your notes. Access and deadline statuses are your records, not verified confirmations.</div>`}
function taskFilter(t,phase){const p=getPlan(),n=daysTo(p?.date),g=p?.goal||'';const recruiting=g.includes('Recruiting');if(phase==='now'){if(n>30)return ['decision','budget','access','targets','story','experience'].includes(t.id);if(n>14)return ['budget','access','targets','story','outreach','experience'].includes(t.id);return ['access','targets','story','outreach','experience','schedule'].includes(t.id)||(n>7&&t.id==='budget')};if(phase==='week')return ['access','outreach','targets','experience','schedule','story'].includes(t.id);if(phase==='onsite')return ['schedule','daychoice','experience','notes','targets'].includes(t.id);return ['followup','learning','notes'].includes(t.id)}
function renderTaskList(p){const eligible=TASKS.filter(t=>taskFilter(t,taskPhase));if(!eligible.some(t=>t.id===selectedTask))selectedTask=eligible[0]?.id||'access';return eligible.map(t=>`<div class="taskrow ${selectedTask===t.id?'active':''}"><input type="checkbox" data-task-check="${t.id}" ${p.tasks[t.id]?'checked':''} aria-label="Mark ${esc(t.label)} done"><button class="titlebutton" data-task="${t.id}"><strong>${esc(t.label)}</strong><small>${esc(t.sub)}</small></button></div>`).join('')}
function renderEditor(p){const t=TASKS.find(x=>x.id===selectedTask)||TASKS[0];let h=`<div class="edhead"><div class="eyebrow">Worksheet · ${esc(t.stage)}</div><h2>${esc(t.label)}</h2><p>${esc(t.sub)}. Only record information you know; use official sources to verify changing details.</p></div><div class="edbody">`;let b='';switch(t.id){case'decision':b=editorDecision(p);break;case'daychoice':b=editorDayChoice(p);break;case'schedule':b=editorSchedule(p);break;case'access':b=editorAccess(p);break;case'targets':b=editorTargets(p);break;case'story':b=editorStory(p);break;case'budget':b=editorBudget(p);break;case'experience':b=editorExperience(p);break;case'outreach':b=`<p class="muted small">Use the original pre-conference introduction structure; fill only genuine, researched context.</p><div class="tip">A submitted RSVP, an interview invitation and a public interest list are different things.</div><a class="btn primary" href="#/templates/pre">Open introduction template →</a>`;break;case'notes':b=editorNotes(p);break;case'followup':b=`<p class="muted small">First close the loop on any actual promise or official application instruction. Then write an appropriate follow-up, if needed.</p><a class="btn primary" href="#/templates/follow">Open follow-up template →</a>`;break;case'learning':b=editorLearning(p);break;default:b='';}return h+b+`</div>`}
function editorDecision(p){const x=p.decision||{};return `<p class="muted small">A conference is not automatically worthwhile. Make a reasoned go/funded-only/wait/skip decision based on your real circumstances.</p><div class="formrow"><label for="decision-goal">Most useful outcome</label><input id="decision-goal" value="${esc(x.goal||'')}" placeholder="A skill, connection, contribution or role to explore"></div><div class="formrow"><label for="decision-fit">What could this event offer that is hard to replace?</label><input id="decision-fit" value="${esc(x.fit||'')}" placeholder="One concrete opportunity or learning experience"></div><div class="fg2"><div class="formrow"><label for="decision-status">My current decision</label><select id="decision-status">${['Not decided','Go','Only if funded','Wait and prepare','Skip this time'].map(v=>`<option ${x.status===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="formrow"><label for="decision-alt">Alternative (optional)</label><input id="decision-alt" value="${esc(x.alternative||'')}" placeholder="Local fair, community meetup or later event"></div></div><div class="formrow"><label for="decision-next">My next action</label><input id="decision-next" value="${esc(x.next||'')}" placeholder="Verify costs, access or funding before committing"></div><div class="tip">Check the budget separately. Pending support is not spendable money; choosing to wait or skip can be sensible.</div><button class="btn primary" data-save-decision="1">Save decision</button>`}
function editorDayChoice(p){const x=p.dayChoice||{};return `<p class="muted small">Fixed appointments come first. Compare the value of this activity with what you'd miss; do not rely on invented line or availability estimates.</p><div class="formrow"><label for="day-current">Current planned activity</label><input id="day-current" value="${esc(x.current||'')}" placeholder="Booth, session or community stop"></div><div class="formrow"><label for="day-alternative">A realistic alternative</label><input id="day-alternative" value="${esc(x.alternative||'')}" placeholder="Workshop, conversation or break"></div><div class="fg2"><div class="formrow"><label for="day-choice">Decision</label><select id="day-choice">${['Not decided','Keep','Swap','Skip','Verify first'].map(v=>`<option ${x.choice===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="formrow"><label for="day-next">Very next action</label><input id="day-next" value="${esc(x.next||'')}" placeholder="Check event app, confirm access, or head to the activity"></div></div><button class="btn primary" data-save-daychoice="1">Save day-of choice</button>`}
function editorAccess(p){const g=p.goal||'';const career=!g||g.startsWith('Recruiting');const rows=[['registration','Conference registration'],...(career?[['profile','Attendee or talent profile'],['application','Specific employer application']]:[]),['session','Session / gathering RSVP'],['invitation','Interview or invitation confirmation']];return `<p class="form-help small muted">Your statuses are self-reported. A talent profile is not an application. Requested is not confirmed. Recruiting fields are shown only for the recruiting path or before a goal is chosen.</p>${rows.map(([k,label])=>`<div class="statusline"><span>${esc(label)}</span><select data-access="${k}" aria-label="${esc(label)} status">${ACCESS_STATUS.map(x=>`<option ${p.access?.[k]===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`).join('')}<div class="tip">For the organizer's current routes and actual deadlines, use the original event site; a checked profile does not establish admission or an interview.</div>${officialLinks(p)}`}
function officialLinks(p){const e=EVENTS[p.id];if(!e||!e.links?.length)return `<p class="fineprint">For this custom event, find its official website and current attendee instructions yourself.</p>`;return `<div class="sepbar"></div><strong class="small">Organizer references</strong><div class="linkrow">${e.links.map(([a,url])=>`<a class="btn sm" target="_blank" rel="noreferrer noopener" href="${esc(url)}">${esc(a)} ↗</a>`).join('')}</div><p class="fineprint">Links are references, not verification of your personal access or eligibility.</p>`}
function editorTargets(p){const z=editingTarget>=0?p.targets[editingTarget]:null;return `<p class="muted small">Choose a real target or a bounded research task. Save its source, eligibility/access state and exact action. Unknown roles remain unverified.</p><div class="fg2"><div class="formrow"><label for="target-kind">Type</label><select id="target-kind">${JOB_TYPES.map(a=>`<option ${z?.kind===a?'selected':''}>${esc(a)}</option>`).join('')}</select></div><div class="formrow"><label for="target-status">Self-reported access/application status</label><select id="target-status">${ACCESS_STATUS.map(a=>`<option ${z?.status===a?'selected':''}>${esc(a)}</option>`).join('')}</select></div></div><div class="formrow"><label for="target-name">Specific target *</label><input id="target-name" maxlength="140" value="${esc(z?.name||'')}" placeholder="A current eligible posting, session, person or community"></div><div class="formrow"><label for="target-action">Very next action *</label><textarea id="target-action" rows="2" placeholder="Find the real posting and check eligibility before applying">${esc(z?.action||'')}</textarea></div><div class="fg2"><div class="formrow"><label for="target-question">Useful question</label><input id="target-question" value="${esc(z?.question||'')}" placeholder="One genuine question"></div><div class="formrow"><label for="target-backup">Backup</label><input id="target-backup" value="${esc(z?.backup||'')}" placeholder="One realistic alternative"></div></div><div class="fg2"><div class="formrow"><label for="target-link">Public official source URL</label><input id="target-link" type="url" value="${esc(z?.source||'')}" placeholder="https://… or leave blank if not verified"></div><div class="formrow"><label for="target-role-id">Role / event ID (if given)</label><input id="target-role-id" value="${esc(z?.roleId||'')}" placeholder="Actual requisition or event ID"></div></div><div class="linkrow"><button class="btn primary" data-save-target="1">${z?'Update':'Save'} priority</button>${z?'<button class="btn" data-cancel-target="1">Cancel edit</button>':''}<span id="form-warning" class="error" role="alert"></span></div><div class="sepbar"></div><strong class="small">Saved priorities (${p.targets.length}/3)</strong>${p.targets.length?`<ul class="detail-list">${p.targets.map((q,i)=>`<li><div><b>${esc(q.name)}</b><small>${esc(q.action)}${q.roleId?' · '+esc(q.roleId):''}</small></div><div class="linkrow"><button class="btn sm" data-edit-target="${i}">Edit</button><button class="btn sm danger" data-remove-target="${i}">Remove</button></div></li>`).join('')}</ul>`:'<p class="muted small" style="margin-top:9px">No priorities saved yet.</p>'}`}
function editorStory(p){const x=p.story||{};return `<p class="muted small">Make your story specific and true. It can come from classes, work, volunteer activities or a personal project.</p>${[['context','The problem or project','What were you trying to solve?'],['contribution','What you personally did','Your role, trade-off, or decision'],['result','What happened or what you learned','Use actual evidence if available'],['question','A question it helps you ask','What are you still curious about?']].map(([k,l,ph])=>`<div class="formrow"><label for="story-${k}">${l}</label><textarea rows="2" id="story-${k}" placeholder="${ph}">${esc(x[k]||'')}</textarea></div>`).join('')}<button class="btn primary" data-save-story="1">Save story and question</button>`}
function editorSchedule(p){const list=p.activities||[];return `<p class="muted small">Only appointments actually confirmed to you belong in your fixed schedule. A pending RSVP can be saved as a flexible activity but not as a booking.</p><div class="formrow"><label for="activity-label">Activity or commitment *</label><input id="activity-label" placeholder="Actual meeting, workshop, travel block, or tentative activity"></div><div class="fg2"><div class="formrow"><label for="activity-date">Date in event's local calendar *</label><input type="date" id="activity-date" value="${esc(p.date||'')}"></div><div class="formrow"><label for="activity-timezone">IANA event time zone *</label><input id="activity-timezone" value="${esc(p.timezone||'')}" placeholder="America/Los_Angeles"></div></div><div class="fg2"><div class="formrow"><label for="activity-start">Start (event local)</label><input type="time" id="activity-start"></div><div class="formrow"><label for="activity-end">End (event local)</label><input type="time" id="activity-end"></div></div><div class="fg2"><div class="formrow"><label for="activity-venue">Venue or room</label><input id="activity-venue" placeholder="Use actual confirmed room/address"></div><div class="formrow"><label for="activity-access">Self-reported status</label><select id="activity-access">${ACCESS_STATUS.map(a=>`<option>${esc(a)}</option>`).join('')}</select></div></div><div class="fg2"><div class="formrow"><label for="activity-fixed">Scheduling type</label><select id="activity-fixed"><option value="flexible">Flexible / tentative</option><option value="fixed">Fixed, confirmed commitment</option></select></div><div class="formrow"><label for="activity-buffer">Travel/reset buffer (minutes)</label><input id="activity-buffer" type="number" min="0" max="600" value="10"></div></div><div class="fg2"><div class="formrow"><label for="activity-source">Public source URL</label><input id="activity-source" placeholder="https:// or leave blank"></div><div class="formrow"><label for="activity-reference">Private confirmation reference</label><input id="activity-reference" placeholder="Kept out of default print"></div></div><div class="formrow"><label for="activity-backup">Fallback / next action</label><input id="activity-backup" placeholder="One available alternative"></div><div class="linkrow"><button class="btn primary" data-save-activity="1">Save activity</button><span class="error" id="activity-error" role="alert"></span></div><div class="sepbar"></div><strong class="small">Saved activities (${list.length})</strong>${list.length?`<ul class="detail-list">${list.map((a,i)=>`<li><div><b>${esc(a.label)}</b><small>${esc(a.date||'')} ${esc(a.start||'')}–${esc(a.end||'')} · ${a.fixed?'Fixed (user-confirmed)':'Flexible'} · ${esc(a.status)}</small></div><button class="btn sm danger" data-remove-activity="${i}">Remove</button></li>`).join('')}</ul>`:'<p class="muted small">None yet. Empty times are never filled automatically.</p>'}`}
const BUDGET_FIELDS=[['registration','Registration'],['travel','Travel'],['lodging','Lodging'],['local','Local transport'],['food','Food'],['buffer','Buffer'],['direct','Confirmed costs paid directly by someone else'],['reimbursement','Confirmed later reimbursement'],['pending','Funding still pending (not subtracted)']];
function budgetCalc(b){const n=k=>Math.max(0,Number(b[k])||0);const total=['registration','travel','lodging','local','food','buffer'].reduce((a,k)=>a+n(k),0);return {total,net:Math.max(0,total-n('direct')-n('reimbursement')),upfront:Math.max(0,total-n('direct')),pending:n('pending')}}

function defaultPrintPreferences(){return {includeFunding:false,includeContacts:false,includeDrafts:false,includePrivateLinks:false}}

function sensitiveLink(url){return /[?&](?:access_token|token|secret|key|signature|invite_token|auth|ticket)=|\/invite\/[A-Za-z0-9_-]{7,}/i.test(String(url||''))}
function showPublicSource(url,p){if(!url)return '';return sensitiveLink(url)&&!printPrefs(p).includePrivateLinks?'[private source link hidden]':url}
function exportSections(p){const pref=printPrefs(p),sections=[];const add=(title,lines)=>{const clean=lines.map(x=>String(x||'').trim()).filter(Boolean);if(clean.length)sections.push({title,lines:clean})};const q=budgetCalc(p.budget||{});if(p.decision?.next)add('Attendance decision',[`Choice: ${p.decision.status||'Not decided'}; goal: ${p.decision.goal||'unspecified'}`,`Condition / next: ${p.decision.next}`,p.decision.alternative?`Alternative: ${p.decision.alternative}`:'']);add('Chosen priorities',(p.targets||[]).flatMap((x,i)=>[`#${i+1} ${x.name} — ${x.action}`,`Self-reported status: ${x.status||'Needs checking'}${x.roleId?' · Role/event ID: '+x.roleId:''}`,x.source?`Source: ${showPublicSource(x.source,p)}`:'Source: Not verified',x.question?`Question: ${x.question}`:'',x.backup?`Backup: ${x.backup}`:'']));if(Object.keys(p.access||{}).length)add('Self-reported access',Object.entries(p.access).map(([k,v])=>`${k}: ${v}`));if(p.story?.context||p.story?.question)add('Conversation cue',[p.story.context||'',p.story.contribution||'',p.story.result||'',p.story.question?`Question: ${p.story.question}`:'']);const a=p.activities||[];add('Confirmed commitments',a.filter(x=>x.fixed&&x.status==='User-reported confirmed').flatMap(x=>[`${x.date||''} ${x.start||'?'}–${x.end||'?'} ${x.timezone||p.timezone||'local time'} · ${x.label}`,`Venue: ${x.venue||'Not supplied'}`,x.source?`Public source: ${showPublicSource(x.source,p)}`:'',x.buffer?`Buffer: ${x.buffer} min`:'']));add('Flexible or unverified activities',a.filter(x=>!x.fixed||x.status!=='User-reported confirmed').flatMap(x=>[`${x.date||''} ${x.start||''} ${x.label} · Access: ${x.status}`,x.venue?`Location (unconfirmed if access pending): ${x.venue}`:'',x.source?`Public source: ${showPublicSource(x.source,p)}`:'',x.backup?`Backup: ${x.backup}`:'']));if(p.experience?.name)add('Learning and community',[`${p.experience.name} · Status: ${p.experience.access||'Needs checking'}`,p.experience.action||'',p.experience.backup?`Backup: ${p.experience.backup}`:'']);if(p.dayChoice?.next)add('Keep / swap / skip',[`${p.dayChoice.choice||'Not decided'}: ${p.dayChoice.current||''} → ${p.dayChoice.alternative||''}`,`Next: ${p.dayChoice.next}`]);add('Follow-through',(p.notes||[]).flatMap(x=>[`${x.context}: ${x.action}${x.due?' (by '+x.due+')':''} · Your status: ${x.done?'Done':'To do'}`,pref.includeContacts&&x.channel?`Private channel: ${x.channel}`:'']));if(p.insight?.action)add('Apply one insight',[p.insight.learning||'',p.insight.use?`Where: ${p.insight.use}`:'',`Next: ${p.insight.action}`]);if(pref.includeFunding&&Object.values(p.budget||{}).some(x=>x!==''&&x!==null&&x!==undefined))add('Private budget figures',[`Estimated total: ${fmt(q.total)}`,`After confirmed support: ${fmt(q.net)}`,`Potential upfront cash: ${fmt(q.upfront)}`,q.pending?`Pending not counted: ${fmt(q.pending)}`:'']);if(pref.includeDrafts)add('Private message drafts',Object.entries(p.drafts||{}).filter(([_,v])=>v).flatMap(([k,v])=>[`${TEMPLATE_DATA[k]?.name||k}:`,v]));return sections}

ateString())} from your selected event plan. Times, sources and access are user-entered/self-reported; verify official changes before acting. Private contact, money and drafts excluded unless selected.</div></article>`}
function reviewPlan(p){const remarks=[];if(!p.targets?.length)remarks.push('Choose one concrete company, role, session or person, and write your first action.');else if(p.targets.some(x=>!x.action.trim()))remarks.push('A saved priority needs a specific next action that is in your control.');if(!p.access.registration||p.access.registration==='Needs checking')remarks.push('Verify actual event registration in the organizer portal; this tool cannot confirm access.');if(p.targets?.some(x=>x.status==='Needs checking'))remarks.push('One or more target access or application statuses still need official verification.');if(!p.story?.question&&!p.story?.context)remarks.push('Prepare one genuine project story or question for a relevant conversation.');if(!p.experience?.name)remarks.push('Consider one learning or community opportunity beyond the main expo.');return remarks.slice(0,3).length?remarks.slice(0,3):['Your current plan has specific actions. Recheck changing event details and leave room to adjust.']}

'activity-error').textContent=error;return}const row={label,date,start,end,timezone:timezone||p.timezone||'',venue:gv('activity-venue').trim(),status,fixed,buffer:Math.max(0,Number(gv('activity-buffer'))||0),source:gv('activity-source').trim(),confirmationRef:gv('activity-reference').trim(),backup:gv('activity-backup').trim()};p.activities=p.activities||[];p.activities.push(row);p.timezone=timezone||p.timezone;p.tasks.schedule=true;refresh();notify('Activity saved to this conference.');return}if(d.removeActivity!==undefined){const p=getPlan();p.activities.splice(Number(d.removeActivity),1);refresh();return}if(d.saveTarget){const p=getPlan();if(!p)return;const name=gv('target-name').trim(),action=gv('target-action').trim();if(!name||!action){document.getElementById('form-warning').textContent='Add a specific target and a next action.';return}const row={name,action,kind:gv('target-kind'),status:gv('target-status'),question:gv('target-question').trim(),backup:gv('target-backup').trim(),source:gv('target-link').trim(),roleId:gv('target-role-id').trim()};if(editingTarget>=0)p.targets[editingTarget]=row;else if(p.targets.length<3)p.targets.push(row);else{notify('Limit to three active targets for a focused field plan.');return}editingTarget=-1;p.tasks.targets=true;refresh();notify('Priority saved to this conference.');return}if(d.editTarget!==undefined){editingTarget=Number(d.editTarget);render();return}if(d.removeTarget!==undefined){const p=getPlan();p.targets.splice(Number(d.removeTarget),1);editingTarget=-1;refresh();return}if(d.cancelTarget!==undefined){editingTarget=-1;render();return}if(d.saveDecision){const p=getPlan();p.decision={goal:gv('decision-goal').trim(),fit:gv('decision-fit').trim(),status:gv('decision-status'),alternative:gv('decision-alt').trim(),next:gv('decision-next').trim()};p.tasks.decision=Boolean(p.decision.next);refresh();notify('Decision saved.');return}if(d.saveDaychoice){const p=getPlan();p.dayChoice={current:gv('day-current').trim(),alternative:gv('day-alternative').trim(),choice:gv('day-choice'),next:gv('day-next').trim()};p.tasks.daychoice=Boolean(p.dayChoice.next);refresh();notify('Choice saved.');return}if(d.saveStory){const p=getPlan();p.story=Object.fromEntries(['context','contribution','result','question'].map(k=>[k,gv('story-'+k).trim()]));p.tasks.story=Boolean(p.story.context&&p.story.contribution);refresh();notify('Story saved.');return}if(d.saveBudget){const p=getPlan();p.budget=Object.fromEntries(BUDGET_FIELDS.map(([k])=>[k,collectNumber(k)]));p.tasks.budget=true;refresh();notify('Budget saved.');return}if(d.saveExperience){const p=getPlan();p.experience={name:gv('experience-name').trim(),access:gv('experience-access'),action:gv('experience-action').trim(),backup:gv('experience-backup').trim()};p.tasks.experience=Boolean(p.experience.name&&p.experience.action);refresh();notify('Activity saved.');return}if(d.saveNote){const p=getPlan(),ctx=gv('note-context').trim(),action=gv('note-next').trim();if(!ctx||!action){notify('Add the conversation context and a real next action.');return}p.notes=p.notes||[];p.notes.push({context:ctx,action,channel:gv('note-channel').trim(),due:gv('note-due'),done:false,reply:'pending'});p.tasks.notes=true;refresh();notify('Private commitment saved.');return}if(d.toggleNote!==undefined){const p=getPlan(),x=p.notes[Number(d.toggleNote)];if(x)x.done=!x.done;refresh();return}if(d.removeNote!==undefined){const p=getPlan();p.notes.splice(Number(d.removeNote),1);refresh();return}if(d.saveInsight){const p=getPlan();p.insight={learning:gv('insight-learning').trim(),use:gv('insight-use').trim(),action:gv('insight-action').trim()};p.tasks.learning=Boolean(p.insight.action);refresh();notify('Learning saved.');return}if(d.saveTemplate){const p=getPlan();if(!p){notify('Choose a conference in My Conference before saving a template. You can still copy the draft.');return}p.drafts[d.saveTemplate]=gv('template-editor');refresh();notify('Draft saved in this browser.');return}if(d.copyTemplate!==undefined){copyText(gv('template-editor'));return}if(d.copyPlan!==undefined){const p=getPlan();if(p)copyText(fieldPlanText(p));return}if(d.copyText!==undefined){copyText(d.copyText);return}if(d.review!==undefined){const p=getPlan();if(!p)return;const messages=reviewPlan(p);const box=document.createElement('div');box.className='assistbox';box.style.marginTop='14px';box.innerHTML='<strong class="small">Rules-based checklist review (not AI)</strong><ul>'+messages.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><div class="fineprint">These are generic gap checks, not current availability verification.</div>';target.closest('.linkrow')?.insertAdjacentElement('afterend',box);target.disabled=true;return}if(d.print!==undefined){window.print();return}}
function delegatedChange(ev){const t=ev.target,p=getPlan();if(t.id==='switch-event'){switchPlan(t.value);return}if(t.dataset.printPref!==undefined&&p){p.printPreferences={...defaultPrintPreferences(),...p.printPreferences,[t.dataset.printPref]:t.checked};save();render();return}if(t.dataset.access!==undefined&&p){p.access[t.dataset.access]=t.value;save();return}if(t.dataset.taskCheck!==undefined&&p){p.tasks[t.dataset.taskCheck]=t.checked;save();render();return}if(t.dataset.planGoal!==undefined&&p){p.goal=t.value;save();render();return}}
