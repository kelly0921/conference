name: Content source check
on:
  push:
    branches: [main, "develop/**"]
  pull_request:

jobs:
  source-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install print build and validation dependencies
        run: python -m pip install -r requirements-print.txt
      - name: Test embedded editorial snapshot parity
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check application syntax
        run: |
          node --check assets/app.js
          node --check assets/planning.js
          node --check assets/representative.js
          node --check design/palette-review.js
      - name: Test planning, calculations and private exports
        run: node --test tests/runtime.test.cjs tests/planning.test.cjs
      - name: Verify reproducible web and print artifacts
        run: |
          python scripts/build.py --check
          python scripts/validate_print.py
